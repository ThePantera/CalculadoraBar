name: Android APK

# Compila la app para Android en la nube (no hace falta instalar nada en tu PC).
# Se ejecuta a mano: GitHub -> Actions -> "Android APK" -> Run workflow.
# El APK queda en "Artifacts" al final de la ejecución.
on:
  workflow_dispatch:
  push:
    branches: [microapp]   # temporal: sirve para probar el flujo desde esta rama

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Correr las pruebas del motor (si fallan, no se compila)
        run: node --test tests/calc.test.js

      - name: Copiar la app web y los íconos
        run: |
          mkdir -p android-app/www/icons android-app/assets
          cp index.html legal.html manifest.webmanifest android-app/www/
          cp icons/*.png android-app/www/icons/
          mkdir -p android-app/www/img
          cp img/portada.jpg android-app/www/img/
          cp assets/icon-only.png assets/icon-foreground.png assets/icon-background.png android-app/assets/

      - name: Crear el proyecto Android
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Ajustes de privacidad y versión
        working-directory: android-app/android
        run: |
          # La app funciona sin internet: se quita el permiso de red para que sea literal.
          sed -i '/android.permission.INTERNET/d' app/src/main/AndroidManifest.xml
          # Cada ejecución sube el número de versión (Google Play lo exige creciente).
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.${{ github.run_number }}"/' app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle
          grep -c "INTERNET" app/src/main/AndroidManifest.xml || true

      - name: Compilar APK de prueba (firmado con clave de depuración)
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BarManagerPro-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ---- Opcional: versión para Google Play (solo si cargaste los 4 secretos de la clave) ----
      - name: Compilar AAB y APK de producción firmados
        if: env.KEYSTORE_B64 != ''
        working-directory: android-app/android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew bundleRelease assembleRelease --no-daemon
          jarsigner -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA -digestalg SHA-256 app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --out app/build/outputs/apk/release/BarManagerPro-release.apk "$RUNNER_TEMP/aligned.apk"

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_B64 != ''
        with:
          name: BarManagerPro-release
          path: |
            android-app/android/app/build/outputs/bundle/release/app-release.aab
            android-app/android/app/build/outputs/apk/release/BarManagerPro-release.apk
          if-no-files-found: error
