<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejecutor de pruebas (navegador)</title>
</head>
<body>
<!--
  Corre tests/calc.test.js en el navegador, sin Node. Lo usa tests/run.sh con Edge/Chrome sin interfaz.
  Imita lo mínimo de node:test, node:assert, node:fs, node:path y node:vm.
-->
<pre id="out">RUNNING</pre>
<script>
(function () {
    const tests = [];
    const deep = (a, b) => JSON.stringify(a) === JSON.stringify(b);
    const fail = (msg) => { throw new Error(msg); };
    const assert = {
        ok: (v, msg) => { if (!v) fail(msg || 'ok: valor falso'); },
        strictEqual: (a, b, msg) => { if (a !== b) fail((msg ? msg + ': ' : '') + 'esperado ' + JSON.stringify(b) + ' y fue ' + JSON.stringify(a)); },
        notStrictEqual: (a, b, msg) => { if (a === b) fail(msg || 'notStrictEqual'); },
        deepStrictEqual: (a, b, msg) => { if (!deep(a, b)) fail((msg ? msg + ': ' : '') + 'esperado ' + JSON.stringify(b) + ' y fue ' + JSON.stringify(a)); },
        doesNotThrow: (fn) => { fn(); }
    };
    const mods = {
        'node:test': (name, fn) => tests.push({ name, fn }),
        'node:assert': assert,
        'node:path': { join: (...p) => p.filter(x => x !== '').join('/') },
        'node:fs': {
            readFileSync: (p) => {
                const x = new XMLHttpRequest();
                x.open('GET', p, false);
                x.send();
                if (x.status !== 0 && x.status !== 200) fail('No se pudo leer ' + p);
                return x.responseText;
            }
        },
        'node:vm': {
            createContext: (o) => o,
            runInContext: (code, ctx) => (new Function(code)).call(ctx)
        }
    };
    window.__errors = [];
    window.addEventListener('error', (e) => window.__errors.push(e.message + ' (' + String(e.filename).split('/').pop() + ':' + e.lineno + ':' + e.colno + ')'));
    window.require = (n) => { if (!mods[n]) fail('módulo no soportado: ' + n); return mods[n]; };
    window.__dirname = '.';
    window.__runnerAssert = assert;
    window.__runAll = async function () {
        let pass = 0, bad = 0;
        const lines = [];
        for (const t of tests) {
            try { await t.fn(); pass++; lines.push('PASS ' + t.name); }
            catch (e) { bad++; lines.push('FAIL ' + t.name + ' -> ' + e.message); }
        }
        window.__errors.forEach(m => { bad++; lines.push('FAIL error de carga -> ' + m); });
        if (tests.length === 0) { bad++; lines.push('FAIL no se registró ninguna prueba'); }
        lines.push('RESULT: ' + pass + ' passed, ' + bad + ' failed');
        document.getElementById('out').textContent = lines.join('\n');
    };
})();
</script>
<script src="calc.test.js"></script>
<script>
    window.addEventListener('load', () => { window.__runAll().catch(e => { document.getElementById('out').textContent = 'RESULT: runner error ' + e.message; }); });
</script>
</body>
</html>
